<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.mp{transform-box:fill-box;transform-origin:50% 50%;animation:mpk 1.9s cubic-bezier(.34,.7,.24,1) infinite}.ms{transform-box:fill-box;transform-origin:50% 100%;animation:msk 2.7s ease-in-out infinite alternate}.mk{animation:mkk 1.6s ease-in-out infinite}.mg{transform-box:fill-box;animation:mgk 2.6s ease-in-out infinite alternate}@keyframes mpk{0%,100%{transform:scale(1)}24%{transform:scale(var(--s,1.12))}48%{transform:scale(1)}}@keyframes msk{from{transform:rotate(calc(-1*var(--sw,1.5deg)))}to{transform:rotate(var(--sw,1.5deg))}}@keyframes mdk{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes mbk{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}@keyframes mkk{0%,100%{fill-opacity:1}50%{fill-opacity:var(--k,.25)}}@keyframes mkok{0%,100%{stroke-opacity:1}50%{stroke-opacity:var(--k,.3)}}@keyframes mtk{0%,100%{letter-spacing:calc(var(--l0,0px) - 2px)}50%{letter-spacing:calc(var(--l0,0px) + 3px)}}@keyframes mgk{from{transform:translateY(0)}to{transform:translateY(var(--gy,-5px))}}@media (prefers-reduced-motion:reduce){.mp,.ms,.mk,.mg{animation:none!important}}.hover-scene{transform-box:view-box;transform-origin:50% 80%;animation:hover-scene-motion 2.8s ease-in-out infinite alternate}@keyframes hover-scene-motion{from{transform:translateY(0)}to{transform:translateY(-22px)}}@media(prefers-reduced-motion:reduce){.hover-scene{animation:none!important}}</style><g class="hover-scene"><g transform="translate(800 730) scale(1.000) translate(-800 -730)"><rect x="0" y="0" width="1600" height="900" fill="#FFD0E2"/><rect x="0" y="730" width="1600" height="170" fill="#F3F0E9"/><polygon points="650,730 950,730 890,778 590,778" fill="#E8B8CC" class="mp" style="animation-delay:-0.12s;--s:1.18"/><rect x="690" y="140" width="220" height="590" fill="#F2271A" class="mp" style="animation-delay:-0.35s;--s:1.18"/><circle cx="800" cy="240" r="84" fill="#111110" class="mp" style="animation-delay:-0.94s;--s:1.22"/><rect x="750" y="230" width="100" height="20" fill="#FFE600" rx="10" class="mk" style="animation-delay:-0.61s;--k:.32"/><rect x="690" y="350" width="220" height="150" fill="#2C3FD6" class="mk" style="animation-delay:-0.23s;--k:.5"/><rect x="730" y="395" width="140" height="18" fill="#FFD0E2" rx="9"/><rect x="730" y="435" width="90" height="18" fill="#FFD0E2" rx="9"/><rect x="690" y="510" width="220" height="150" fill="#FFE600"/><circle cx="800" cy="585" r="40" fill="#111110" class="mp" style="animation-delay:-1.20s;--s:1.18"/><rect x="650" y="674" width="300" height="56" fill="#FFE600"/></g></g></svg>