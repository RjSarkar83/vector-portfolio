<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.mp{transform-box:fill-box;transform-origin:50% 50%;animation:mpk 1.9s cubic-bezier(.34,.7,.24,1) infinite}.ms{transform-box:fill-box;transform-origin:50% 100%;animation:msk 2.7s ease-in-out infinite alternate}.mk{animation:mkk 1.6s ease-in-out infinite}.mg{transform-box:fill-box;animation:mgk 2.6s ease-in-out infinite alternate}@keyframes mpk{0%,100%{transform:scale(1)}24%{transform:scale(var(--s,1.12))}48%{transform:scale(1)}}@keyframes msk{from{transform:rotate(calc(-1*var(--sw,1.5deg)))}to{transform:rotate(var(--sw,1.5deg))}}@keyframes mdk{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes mbk{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}@keyframes mkk{0%,100%{fill-opacity:1}50%{fill-opacity:var(--k,.25)}}@keyframes mkok{0%,100%{stroke-opacity:1}50%{stroke-opacity:var(--k,.3)}}@keyframes mtk{0%,100%{letter-spacing:calc(var(--l0,0px) - 2px)}50%{letter-spacing:calc(var(--l0,0px) + 3px)}}@keyframes mgk{from{transform:translateY(0)}to{transform:translateY(var(--gy,-5px))}}@media (prefers-reduced-motion:reduce){.mp,.ms,.mk,.mg{animation:none!important}}.hover-scene{transform-box:view-box;transform-origin:50% 80%;animation:hover-scene-motion 2.8s ease-in-out infinite alternate}@keyframes hover-scene-motion{from{transform:translateY(0)}to{transform:translateY(-22px)}}@media(prefers-reduced-motion:reduce){.hover-scene{animation:none!important}}</style><g class="hover-scene"><g transform="translate(800 730) scale(1.074) translate(-800 -730)"><rect x="0" y="0" width="1600" height="900" fill="#F3F0E9"/><rect x="0" y="730" width="1600" height="170" fill="#DCC7A5"/><rect x="320" y="730" width="960" height="26" fill="#C9B28C" class="mp" style="animation-delay:-0.29s;--s:1.18"/><polygon points="400,730 1200,730 1150,770 350,770" fill="#C9B28C" class="mp" style="animation-delay:-0.04s;--s:1.18"/><rect x="400" y="250" width="800" height="480" fill="#2C3FD6"/><rect x="400" y="190" width="800" height="70" fill="#111110"/><circle cx="500" cy="225" r="26" fill="#FFE600" class="mp" style="animation-delay:-0.20s;--s:1.18"/><rect x="485.7" y="221.9" width="28.6" height="6.2" fill="#111110" rx="3.1" class="mk" style="animation-delay:-0.36s;--k:.32"/><rect x="560" y="212" width="260" height="26" fill="#F3F0E9" rx="13" class="mk" style="animation-delay:-1.19s;--k:.5"/><rect x="670" y="320" width="260" height="150" fill="#FFE600" class="mk" style="animation-delay:-0.75s;--k:.5"/><rect x="710" y="360" width="100" height="18" fill="#111110" rx="9"/><rect x="710" y="396" width="160" height="18" fill="#111110" rx="9"/><rect x="530" y="560" width="540" height="170" fill="#F2271A"/><rect x="510" y="540" width="580" height="26" fill="#111110"/><circle cx="800" cy="640" r="38" fill="#F3F0E9" class="mp" style="animation-delay:-0.47s;--s:1.22"/><rect x="430" y="360" width="150" height="200" fill="#F3F0E9"/><rect x="1020" y="360" width="150" height="200" fill="#F3F0E9"/></g></g></svg>