<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="520" height="400" preserveAspectRatio="xMidYMid meet"><style>
.led{animation:led 5.2s ease-in-out infinite}
.tw{animation:tw 2.9s ease-in-out infinite}
.bt{animation:bt 3.6s ease-in-out infinite}
.gl{animation:gl 7.5s ease-in-out infinite}
.pp{animation:pp 5.6s ease-in-out infinite}
.dg{transform-box:fill-box;transform-origin:50% 8%;animation:dg 4.6s ease-in-out infinite alternate}
.pl{transform-box:fill-box;transform-origin:50% 94%;animation:pl 5.4s ease-in-out infinite alternate}
.hg{transform-box:fill-box;transform-origin:50% 2%;animation:hg 6.6s ease-in-out infinite alternate}
.fl{animation:fl 1.8s ease-in-out infinite alternate}
.rt{transform-box:fill-box;transform-origin:50% 50%;animation:rt 12s linear infinite}
.bl{animation:bl 4.6s steps(1,end) infinite}
@keyframes led{0%,100%{fill-opacity:.5}44%{fill-opacity:1}}
@keyframes tw{0%,100%{fill-opacity:.28}50%{fill-opacity:1}}
@keyframes bt{0%,100%{fill-opacity:.7}50%{fill-opacity:1}}
@keyframes gl{0%,100%{fill-opacity:.45}50%{fill-opacity:1}}
@keyframes pp{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes dg{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
@keyframes pl{from{transform:rotate(-3.4deg)}to{transform:rotate(3.4deg)}}
@keyframes hg{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
@keyframes fl{from{opacity:.5;transform:scaleY(.9)}to{opacity:1;transform:scaleY(1.12)}}
@keyframes rt{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes bl{0%,48%{fill-opacity:1}49%,100%{fill-opacity:.22}}
@media (prefers-reduced-motion:reduce){.led,.tw,.bt,.gl,.pp,.dg,.pl,.hg,.fl,.sc.b,.rt,.bl{animation:none!important}}
