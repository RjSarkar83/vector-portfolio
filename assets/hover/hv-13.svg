<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.mp{transform-box:fill-box;transform-origin:50% 50%;animation:mpk 1.9s cubic-bezier(.34,.7,.24,1) infinite}.ms{transform-box:fill-box;transform-origin:50% 100%;animation:msk 2.7s ease-in-out infinite alternate}.mk{animation:mkk 1.6s ease-in-out infinite}.mg{transform-box:fill-box;animation:mgk 2.6s ease-in-out infinite alternate}@keyframes mpk{0%,100%{transform:scale(1)}24%{transform:scale(var(--s,1.12))}48%{transform:scale(1)}}@keyframes msk{from{transform:rotate(calc(-1*var(--sw,1.5deg)))}to{transform:rotate(var(--sw,1.5deg))}}@keyframes mdk{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes mbk{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}@keyframes mkk{0%,100%{fill-opacity:1}50%{fill-opacity:var(--k,.25)}}@keyframes mkok{0%,100%{stroke-opacity:1}50%{stroke-opacity:var(--k,.3)}}@keyframes mtk{0%,100%{letter-spacing:calc(var(--l0,0px) - 2px)}50%{letter-spacing:calc(var(--l0,0px) + 3px)}}@keyframes mgk{from{transform:translateY(0)}to{transform:translateY(var(--gy,-5px))}}@media (prefers-reduced-motion:reduce){.mp,.ms,.mk,.mg{animation:none!important}}.hover-scene{transform-box:view-box;transform-origin:50% 80%;animation:hover-scene-motion 2.8s ease-in-out infinite alternate}@keyframes hover-scene-motion{from{transform:translateY(0)}to{transform:translateY(-22px)}}@media(prefers-reduced-motion:reduce){.hover-scene{animation:none!important}}</style><g class="hover-scene"><g transform="translate(800 730) scale(1.318) translate(-800 -730)"><rect x="0" y="0" width="1600" height="900" fill="#FFE600"/><rect x="0" y="730" width="1600" height="170" fill="#2C3FD6"/><polygon points="420,730 1180,730 1130,770 370,770" fill="#2231A8" class="mp" style="animation-delay:-1.07s;--s:1.18"/><rect x="420" y="520" width="760" height="26" fill="#FF4F9A" class="mp" style="animation-delay:-0.96s;--s:1.18"/><rect x="450" y="546" width="30" height="184" fill="#FF4F9A" class="ms" style="animation-delay:-1.02s;--sw:4deg"/><rect x="1120" y="546" width="30" height="184" fill="#FF4F9A" class="ms" style="animation-delay:-1.17s;--sw:4deg"/><rect x="630" y="290" width="340" height="215" fill="#F3F0E9" rx="14" class="mk" style="animation-delay:-0.98s;--k:.5"/><rect x="654" y="314" width="292" height="167" fill="#F2271A" rx="6"/><circle cx="740" cy="398" r="46" fill="#111110" class="mp" style="animation-delay:-1.27s;--s:1.22"/><rect x="804" y="370" width="110" height="24" fill="#FFE600" rx="12"/><rect x="804" y="408" width="70" height="24" fill="#FFE600" rx="12"/><rect x="778" y="505" width="44" height="16" fill="#FF4F9A"/><rect x="730" y="517" width="140" height="8" fill="#FF4F9A" rx="4"/><polygon points="1050,520 1130,520 1118,450 1062,450" fill="#111110"/><rect x="1046" y="520" width="90" height="0.1" fill="#111110"/><ellipse cx="1090" cy="360" rx="24" ry="70" fill="#F3F0E9" transform="rotate(-40 1090 450)"/><ellipse cx="1090" cy="360" rx="24" ry="70" fill="#FFE600" transform="rotate(0 1090 450)"/><ellipse cx="1090" cy="360" rx="24" ry="70" fill="#F3F0E9" transform="rotate(40 1090 450)"/><rect x="470" y="470" width="60" height="50" fill="#111110" rx="8"/><rect x="460" y="462" width="80" height="10" fill="#FF4F9A" rx="5"/></g></g></svg>