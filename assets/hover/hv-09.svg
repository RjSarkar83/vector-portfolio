<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.mp{transform-box:fill-box;transform-origin:50% 50%;animation:mpk 1.9s cubic-bezier(.34,.7,.24,1) infinite}.ms{transform-box:fill-box;transform-origin:50% 100%;animation:msk 2.7s ease-in-out infinite alternate}.mk{animation:mkk 1.6s ease-in-out infinite}.mg{transform-box:fill-box;animation:mgk 2.6s ease-in-out infinite alternate}@keyframes mpk{0%,100%{transform:scale(1)}24%{transform:scale(var(--s,1.12))}48%{transform:scale(1)}}@keyframes msk{from{transform:rotate(calc(-1*var(--sw,1.5deg)))}to{transform:rotate(var(--sw,1.5deg))}}@keyframes mdk{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes mbk{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}@keyframes mkk{0%,100%{fill-opacity:1}50%{fill-opacity:var(--k,.25)}}@keyframes mkok{0%,100%{stroke-opacity:1}50%{stroke-opacity:var(--k,.3)}}@keyframes mtk{0%,100%{letter-spacing:calc(var(--l0,0px) - 2px)}50%{letter-spacing:calc(var(--l0,0px) + 3px)}}@keyframes mgk{from{transform:translateY(0)}to{transform:translateY(var(--gy,-5px))}}@media (prefers-reduced-motion:reduce){.mp,.ms,.mk,.mg{animation:none!important}}.hover-scene{transform-box:view-box;transform-origin:50% 80%;animation:hover-scene-motion 2.8s ease-in-out infinite alternate}@keyframes hover-scene-motion{from{transform:translateY(0)}to{transform:translateY(-22px)}}@media(prefers-reduced-motion:reduce){.hover-scene{animation:none!important}}</style><g class="hover-scene"><g transform="translate(800 730) scale(1.400) translate(-800 -730)"><rect x="0" y="0" width="1600" height="900" fill="#B8A4FF"/><rect x="0" y="730" width="1600" height="170" fill="#F3F0E9"/><polygon points="380,730 1240,730 1180,778 320,778" fill="#9C88E8" class="mp" style="animation-delay:-0.11s;--s:1.18"/><rect x="380" y="370" width="650" height="270" fill="#2C3FD6" rx="30"/><polygon points="1030,430 1130,430 1210,530 1210,640 1030,640" fill="#FFE600" class="mk" style="animation-delay:-1.29s;--k:.5"/><polygon points="1060,450 1122,450 1170,520 1060,520" fill="#B8A4FF" class="mk" style="animation-delay:-1.23s;--k:.32"/><rect x="380" y="500" width="650" height="56" fill="#F2271A"/><circle cx="550" cy="435" r="40" fill="#B8A4FF"/><rect x="528" y="430.2" width="44" height="9.6" fill="#2C3FD6" rx="4.8" class="mk" style="animation-delay:-0.70s;--k:.32"/><rect x="610" y="420" width="200" height="18" fill="#B8A4FF" rx="9"/><rect x="610" y="450" width="130" height="18" fill="#B8A4FF" rx="9"/><rect x="380" y="636" width="830" height="18" fill="#111110" rx="9" class="mp" style="animation-delay:-0.73s;--s:1.18"/><circle cx="550" cy="668" r="62" fill="#111110" class="mp" style="animation-delay:-0.25s;--s:1.22"/><circle cx="550" cy="668" r="26" fill="#B8A4FF"/><circle cx="1080" cy="668" r="62" fill="#111110" class="mp" style="animation-delay:-0.68s;--s:1.18"/><circle cx="1080" cy="668" r="26" fill="#B8A4FF"/></g></g></svg>