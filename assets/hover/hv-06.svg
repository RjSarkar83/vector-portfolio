<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.mp{transform-box:fill-box;transform-origin:50% 50%;animation:mpk 1.9s cubic-bezier(.34,.7,.24,1) infinite}.ms{transform-box:fill-box;transform-origin:50% 100%;animation:msk 2.7s ease-in-out infinite alternate}.mk{animation:mkk 1.6s ease-in-out infinite}.mg{transform-box:fill-box;animation:mgk 2.6s ease-in-out infinite alternate}@keyframes mpk{0%,100%{transform:scale(1)}24%{transform:scale(var(--s,1.12))}48%{transform:scale(1)}}@keyframes msk{from{transform:rotate(calc(-1*var(--sw,1.5deg)))}to{transform:rotate(var(--sw,1.5deg))}}@keyframes mdk{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes mbk{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}@keyframes mkk{0%,100%{fill-opacity:1}50%{fill-opacity:var(--k,.25)}}@keyframes mkok{0%,100%{stroke-opacity:1}50%{stroke-opacity:var(--k,.3)}}@keyframes mtk{0%,100%{letter-spacing:calc(var(--l0,0px) - 2px)}50%{letter-spacing:calc(var(--l0,0px) + 3px)}}@keyframes mgk{from{transform:translateY(0)}to{transform:translateY(var(--gy,-5px))}}@media (prefers-reduced-motion:reduce){.mp,.ms,.mk,.mg{animation:none!important}}.hover-scene{transform-box:view-box;transform-origin:50% 80%;animation:hover-scene-motion 2.8s ease-in-out infinite alternate}@keyframes hover-scene-motion{from{transform:translateY(0)}to{transform:translateY(-22px)}}@media(prefers-reduced-motion:reduce){.hover-scene{animation:none!important}}</style><g class="hover-scene"><g transform="translate(800 730) scale(1.055) translate(-800 -730)"><rect x="0" y="0" width="1600" height="900" fill="#14173F"/><rect x="0" y="730" width="1600" height="170" fill="#262B6B" class="mp" style="animation-delay:-0.45s;--s:1.18"/><circle cx="630" cy="420" r="140" fill="none" stroke="#FFF3B0" stroke-width="18" class="mp" style="animation-delay:-0.49s;--s:1.22"/><circle cx="630" cy="420" r="70" fill="none" stroke="#FF4F9A" stroke-width="18" class="mp" style="animation-delay:-0.32s;--s:1.18"/><path d="M840,420H1100M1010,330L1100,420L1010,510" fill="none" stroke="#12A89A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" class="md" pathLength="1" style="animation-delay:-0.02s"/><path d="M470,640q40,-50 80,0t80,0t80,0t80,0t80,0t80,0" fill="none" stroke="#FFE600" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" class="md" pathLength="1" style="animation-delay:-1.30s"/><circle cx="470" cy="180" r="10" fill="#F3F0E9" class="mp" style="animation-delay:-0.00s;--s:1.18"/><circle cx="1130" cy="180" r="10" fill="#F3F0E9"/></g></g></svg>