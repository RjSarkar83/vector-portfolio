<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.mp{transform-box:fill-box;transform-origin:50% 50%;animation:mpk 1.9s cubic-bezier(.34,.7,.24,1) infinite}.ms{transform-box:fill-box;transform-origin:50% 100%;animation:msk 2.7s ease-in-out infinite alternate}.mk{animation:mkk 1.6s ease-in-out infinite}.mg{transform-box:fill-box;animation:mgk 2.6s ease-in-out infinite alternate}@keyframes mpk{0%,100%{transform:scale(1)}24%{transform:scale(var(--s,1.12))}48%{transform:scale(1)}}@keyframes msk{from{transform:rotate(calc(-1*var(--sw,1.5deg)))}to{transform:rotate(var(--sw,1.5deg))}}@keyframes mdk{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes mbk{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}@keyframes mkk{0%,100%{fill-opacity:1}50%{fill-opacity:var(--k,.25)}}@keyframes mkok{0%,100%{stroke-opacity:1}50%{stroke-opacity:var(--k,.3)}}@keyframes mtk{0%,100%{letter-spacing:calc(var(--l0,0px) - 2px)}50%{letter-spacing:calc(var(--l0,0px) + 3px)}}@keyframes mgk{from{transform:translateY(0)}to{transform:translateY(var(--gy,-5px))}}@media (prefers-reduced-motion:reduce){.mp,.ms,.mk,.mg{animation:none!important}}.hover-scene{transform-box:view-box;transform-origin:50% 80%;animation:hover-scene-motion 2.8s ease-in-out infinite alternate}@keyframes hover-scene-motion{from{transform:translateY(0)}to{transform:translateY(-22px)}}@media(prefers-reduced-motion:reduce){.hover-scene{animation:none!important}}</style><g class="hover-scene"><g transform="translate(800 730) scale(1.142) translate(-800 -730)"><rect x="0" y="0" width="1600" height="900" fill="#E8D5B5"/><rect x="0" y="730" width="1600" height="170" fill="#D9A441" class="mp" style="animation-delay:-0.62s;--s:1.18"/><polygon points="770,730 830,730 790,770 730,770" fill="#C08F2E" class="mk" style="animation-delay:-0.62s;--k:.32"/><rect x="788" y="240" width="24" height="490" fill="#111110" class="mp" style="animation-delay:-0.04s;--s:1.18"/><circle cx="800" cy="222" r="26" fill="#111110" class="mp" style="animation-delay:-0.51s;--s:1.22"/><rect x="730" y="706" width="140" height="24" fill="#111110" rx="8" class="mk" style="animation-delay:-1.10s;--k:.5"/><polygon points="800,280 1050,280 1110,325 1050,370 800,370" fill="#2C3FD6" class="mp" style="animation-delay:-0.25s;--s:1.18"/><rect x="830" y="312" width="150" height="26" fill="#E8D5B5" rx="13"/><polygon points="800,390 550,390 490,435 550,480 800,480" fill="#F2271A"/><rect x="590" y="422" width="150" height="26" fill="#E8D5B5" rx="13"/><polygon points="800,500 1050,500 1110,545 1050,590 800,590" fill="#F3F0E9"/><rect x="830" y="532" width="150" height="26" fill="#E8D5B5" rx="13"/></g></g></svg>