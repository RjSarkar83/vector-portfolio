<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.mp{transform-box:fill-box;transform-origin:50% 50%;animation:mpk 1.9s cubic-bezier(.34,.7,.24,1) infinite}.ms{transform-box:fill-box;transform-origin:50% 100%;animation:msk 2.7s ease-in-out infinite alternate}.mk{animation:mkk 1.6s ease-in-out infinite}.mg{transform-box:fill-box;animation:mgk 2.6s ease-in-out infinite alternate}@keyframes mpk{0%,100%{transform:scale(1)}24%{transform:scale(var(--s,1.12))}48%{transform:scale(1)}}@keyframes msk{from{transform:rotate(calc(-1*var(--sw,1.5deg)))}to{transform:rotate(var(--sw,1.5deg))}}@keyframes mdk{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes mbk{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}@keyframes mkk{0%,100%{fill-opacity:1}50%{fill-opacity:var(--k,.25)}}@keyframes mkok{0%,100%{stroke-opacity:1}50%{stroke-opacity:var(--k,.3)}}@keyframes mtk{0%,100%{letter-spacing:calc(var(--l0,0px) - 2px)}50%{letter-spacing:calc(var(--l0,0px) + 3px)}}@keyframes mgk{from{transform:translateY(0)}to{transform:translateY(var(--gy,-5px))}}@media (prefers-reduced-motion:reduce){.mp,.ms,.mk,.mg{animation:none!important}}.hover-scene{transform-box:view-box;transform-origin:50% 80%;animation:hover-scene-motion 2.8s ease-in-out infinite alternate}@keyframes hover-scene-motion{from{transform:translateY(0)}to{transform:translateY(-22px)}}@media(prefers-reduced-motion:reduce){.hover-scene{animation:none!important}}</style><g class="hover-scene"><g transform="translate(800 730) scale(1.400) translate(-800 -730)"><rect x="0" y="0" width="1600" height="900" fill="#2C3FD6"/><rect x="0" y="730" width="1600" height="170" fill="#111110"/><polygon points="460,730 1200,730 1130,792 390,792" fill="#2231A8" class="mp" style="animation-delay:-1.37s;--s:1.18"/><rect x="460" y="430" width="300" height="300" fill="#F3F0E9" class="mk" style="animation-delay:-0.26s;--k:.5"/><rect x="580" y="430" width="60" height=