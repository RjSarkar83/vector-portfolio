<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="520" height="400" preserveAspectRatio="xMidYMid meet"><style>
.led{animation:led 5.2s ease-in-out infinite}
.tw{animation:tw 2.9s ease-in-out infinite}
.bt{animation:bt 3.6s ease-in-out infinite}
.gl{animation:gl 7.5s ease-in-out infinite}
.pp{animation:pp 5.6s ease-in-out infinite}
.dg{transform-box:fill-box;transform-origin:50% 8%;animation:dg 4.6s ease-in-out infinite alternate}
.pl{transform-box:fill-box;transform-origin:50% 94%;animation:pl 5.4s ease-in-out infinite alternate}
.hg{transform-box:fill-box;transform-origin:50% 2%;animation:hg 6.6s ease-in-out infinite alternate}
.fl{animation:fl 1.8s ease-in-out infinite alternate}
