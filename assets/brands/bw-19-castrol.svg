@keyframes pl{from{transform:rotate(-3.4deg)}to{transform:rotate(3.4deg)}}
@keyframes hg{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
@keyframes fl{from{opacity:.5;transform:scaleY(.9)}to{opacity:1;transform:scaleY(1.12)}}
@keyframes rt{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes bl{0%,48%{fill-opacity:1}49%,100%{fill-opacity:.22}}
@media (prefers-reduced-motion:reduce){.led,.tw,.bt,.gl,.pp,.dg,.pl,.hg,.fl,.sc.b,.rt,.bl{animation:none!important}}
